<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
     <div class="container">
        <img src= "ChatGPT Image 6 de out. de 2026, 13_23_46.png" alt="logo" 

        <form>

        <div class="from-cotrol">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" />
        </div>

        <div class="form-control">
            <label for="data">Data de Nascimento: </label>
            <input type="date" name="data" />
        </div>

        <div class="form-control">
            <label for="email">Email:</label>
            <input type="email" id="email" />
        </div>
        
        <div class="form-control">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" />
        </div>

        <div class="from-cotrol">
            <label for="data de check-in">Data de check-in:</label>
            <input type="date" name="data de check-in" /> 
        </div>

        <div class="from-cotrol">
            <label for="data de checkout">Data de checkout:</label>
            <input type="date" name="data de checkout" /> 
        </div>

        <div class="form-control">
            <label for="destino escolhido">Destino escolhido:</label>
             <input for="destino escolhido" name="destino escolhido:" />
        </div>

        <div class="form-control">
            <label for="dias que ira ficar">Dias que irá ficar:</label>
            <input for="dias que irá ficar" name="dias que ira ficar:" />
        </div>

        <div class="from-cotrol">
            <label for="forma de pagamento">Forma de pagamento:</label>
            <select name="forma de pagamento" id="forma de pagamento">
                <option value="">Selecione</option>
                <option value="pix">Pix</option>
                <option value="cartao de debito">Cartão de débito</option>
                <option value="cartao de credito">Cartão de Crédito</option>
                <option value="boleto">Boleto</option>
            </select>
        </div>

        <div class="from-cotrol">
            <label for="escolha seu quarto">Escolha seu quarto:</label>
            <select name="escolha seu quarto" id="escolha seu quarto">
                <option value="">Selecione</option>
                <option value="quarto Standard — 1 cama — R$ 350/noite">Quarto Standard — 1 cama — R$ 350/noite</option>
                <option value="quarto Deluxe — 1 cama king — R$ 500/noite">Quarto Deluxe — 1 cama king — R$ 500/noite</option>
                <option value="suíte Blue Haven — vista para o mar — R$ 750/noite">Suíte Blue Haven — vista para o mar — R$ 750/noite</option>
            </select>
        </div>

          <div class="form-ontrol">
            <button type="submit">Reservar</button> 
            <button type="reset">Limpar</button>
        </div>

        </form>

    </div>
</body>
</html>
